# Porta exclusiva de prontidão. Não publicar no host ou na internet.
# Na AWS, o security group permite 8082 somente a partir do ALB.
server {
    listen 8082;
    server_name _;
    access_log off;

    location = /healthz {
        proxy_pass http://aplicacao/health;
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        return 404;
    }
}
