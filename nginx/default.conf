# O DNS interno do Docker acompanha a recriação e as réplicas de web.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream aplicacao {
    zone aplicacao 64k;
    server web:5000 resolve;
}

server {
    listen 80;
    server_name _;

    # Mantém o comportamento da aplicação, que não define limite de upload.
    client_max_body_size 0;

    location / {
        proxy_pass http://aplicacao;
        proxy_http_version 1.1;
        # Evita espera longa por um endereço removido durante a troca de réplicas.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
