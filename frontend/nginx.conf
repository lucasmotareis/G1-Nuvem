# ECS/Fargate: ambos os contêineres pertencem à mesma task (awsvpc).
upstream aplicacao {
    server 127.0.0.1:5000;
}

# HTTPS pode terminar no ALB ou no CloudFront, que chega por VPC origin privada.
# CloudFront gera este cabeçalho; a rede só permite o ALB na porta do frontend.
map "$http_x_forwarded_proto:$http_cloudfront_forwarded_proto" $entrada_https {
    default 0;
    ~^https: 1;
    "http:https" 1;
}

server {
    listen 80;
    server_name _;
    # Somente o ALB deve alcançar esta porta na AWS.
    # O Compose usa outro arquivo, permitindo HTTP apenas no teste local.
    if ($entrada_https = 0) {
        return 426;
    }
    include /etc/nginx/snippets/achados-routing.conf;
}
