root /usr/share/nginx/html;
server_tokens off;
add_header X-Content-Type-Options nosniff always;
auth_basic "Achados e Perdidos";
auth_basic_user_file /run/nginx-auth/htpasswd;

# Preserva o comportamento da API, que não define limite de upload.
# A validação de 10 MB existe apenas na interface, não como controle de segurança.
client_max_body_size 0;

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/(index\.html|styles\.css|app\.js)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

# Rotas da API e seus erros/404 continuam pertencendo ao Flask.
location / {
    proxy_pass http://aplicacao;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A senha de entrada pertence ao Nginx; não repassá-la ao Flask.
    proxy_set_header Authorization "";
}
